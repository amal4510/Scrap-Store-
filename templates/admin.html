
{%include 'admin_header.html'%}
    <!-- Main Content -->
    <div class="container mt-5">
        <h1 class="text-center mb-4">Admin Dashboard</h1>
        <h3> Current Products in auction</h3>
        <!-- Product Cards -->
        <div class="row">
            {% for product in products %}
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <img src="{{ url_for('static', filename=product.image_file) }}" class="card-img-top" alt="{{ product.title }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ product.title }}</h5>
                        <p class="card-text">{{ product.description }}</p>
                        <p class="card-text"><strong>Price:</strong> ₹{{ product.price }}</p>
                    </div>
                    <div class="card-footer d-flex justify-content-between">
                        <a href="{{ url_for('admin.update_scrap', scrap_id=product.id) }}" class="btn btn-warning btn-sm">Update</a>
                        <form action="{{ url_for('admin.delete_scrap', scrap_id=product.id) }}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                        </form>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
