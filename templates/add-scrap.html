

  {% include 'header.html' %}
<main>
  <div class="container py-5">
    <div class="bg-light p-4 rounded shadow">
      <h2 class="mb-4 text-center text-success">Submit Your Scrap Information</h2>

      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="mb-3">
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <!-- Scrap Submission Form -->
      <form action="{{ url_for('add_scrap') }}" method="POST" enctype="multipart/form-data">
        <div class="row">
          <!-- Title -->
          <div class="mb-3 col-md-6">
            <label for="title" class="form-label">Scrap Title</label>
            <input type="text" class="form-control" id="title" name="title" placeholder="Enter the scrap title" required>
          </div>

          <!-- Price -->
          <div class="mb-3 col-md-6">
            <label for="price" class="form-label">Price (₹)</label>
            <input type="number" step="0.01" class="form-control" id="price" name="price" placeholder="Enter the scrap price" required>
          </div>
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea class="form-control" id="description" name="description" rows="4" placeholder="Describe the scrap" required></textarea>
        </div>

        <!-- Duration -->
        <div class="mb-3">
          <label for="duration" class="form-label">Auction Duration (in minutes)</label>
          <input type="number" class="form-control" id="duration" name="duration" placeholder="e.g., 60 for 1 hour" min="1" required>
        </div>

        <!-- Image Upload -->
        <div class="mb-3">
          <label for="file-input" class="form-label">Upload Image</label>
          <input type="file" class="form-control" id="file-input" name="image_file" accept="image/*" required>
          <div id="preview-container" class="mt-3"></div>
        </div>

        <!-- Submit -->
        <div class="text-center">
          <button type="submit" class="btn btn-success px-4 py-2">Submit Scrap</button>
        </div>
      </form>
    </div>
  </div>
</main>
  <!-- Preview Script -->
  <script>
    document.getElementById('file-input').addEventListener('change', function(event) {
      const previewContainer = document.getElementById('preview-container');
      previewContainer.innerHTML = '';

      const files = event.target.files;
      if (files.length > 0) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.createElement('img');
          img.src = e.target.result;
          img.className = "img-thumbnail";
          img.style.maxWidth = "200px";
          previewContainer.appendChild(img);
        }
        reader.readAsDataURL(files[0]);
      }
    });
  </script>
</body>
</html>
